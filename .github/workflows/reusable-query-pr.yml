# Callable workflow: query one PR against the latest KB artifact in the caller repo.
# Caller must grant actions: read and run the KB workflow at least once.

name: Reusable query single PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to query
        required: true
        type: number
      config:
        type: string
        default: configs/ceph.yml
      tool_repository:
        type: string
        default: RaminNietzsche/pr-triage
      tool_ref:
        type: string
        default: main
      kb_workflow_file:
        description: Workflow filename in caller repo that uploads the KB (e.g. pr-triage-kb.yml)
        type: string
        default: pr-triage-kb.yml
      kb_artifact_name:
        type: string
        default: pr-triage-kb-snapshot
      all_findings:
        type: boolean
        default: true
      refresh_target:
        type: boolean
        default: true
      upload_json_artifact:
        type: boolean
        default: true
      post_comment:
        description: Upsert a PR comment (requires pull-requests write on caller)
        type: boolean
        default: false
      comment_repo:
        description: owner/name for comment (default caller repository)
        type: string
        default: ""
      comment_pr_number:
        description: PR to comment on (default same as pr_number)
        type: number
        default: 0
      post_on_query_failure:
        description: Post short "not in snapshot" comment when per-pr exits non-zero
        type: boolean
        default: false
      github_repo_links:
        description: Repo slug for pull links in the comment body
        type: string
        default: ceph/ceph

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pr-triage
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repository }}
          ref: ${{ inputs.tool_ref }}
          path: pr-triage
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: pr-triage
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r requirements-lock.txt

      - name: Download latest KB artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x pr-triage/scripts/ci_download_kb_artifact.sh
          pr-triage/scripts/ci_download_kb_artifact.sh \
            "${{ inputs.kb_workflow_file }}" \
            "${{ inputs.kb_artifact_name }}" \
            kb-artifact

      - name: Restore clone cache
        uses: actions/cache@v4
        with:
          path: pr-triage/data/repo
          key: pr-triage-clone-${{ github.repository }}-${{ inputs.config }}
          restore-keys: |
            pr-triage-clone-${{ github.repository }}-

      - name: Extract KB and fetch PR ref
        working-directory: pr-triage
        env:
          PR: ${{ inputs.pr_number }}
        run: |
          TAR="$(find ../kb-artifact -name 'kb-snapshot.tar.gz' -print -quit)"
          if [[ -z "$TAR" || ! -f "$TAR" ]]; then
            echo "KB tarball missing under kb-artifact (got: $(find ../kb-artifact -type f 2>/dev/null | head -5))"
            exit 2
          fi
          mkdir -p data
          tar -xzf "$TAR" -C data
          CLONE=$(python3 -c "import yaml;from pathlib import Path;c=yaml.safe_load(Path('${{ inputs.config }}').read_text());print((c.get('github')or{}).get('clone_dir','data/repo/ceph'))")
          if [ -d "$CLONE" ]; then
            git -C "$CLONE" fetch -q origin "pull/${PR}/head:refs/pr/${PR}" || true
          fi

      - name: Query PR
        id: query
        working-directory: pr-triage
        env:
          PR: ${{ inputs.pr_number }}
        run: |
          ARGS=(per-pr --config "${{ inputs.config }}" --pr "$PR" --kb data/kb-snapshot --json)
          if [ "${{ inputs.all_findings }}" = "true" ]; then ARGS+=(--all-findings); fi
          if [ "${{ inputs.refresh_target }}" = "true" ]; then
            CLONE=$(python3 -c "import yaml;from pathlib import Path;c=yaml.safe_load(Path('${{ inputs.config }}').read_text());print((c.get('github')or{}).get('clone_dir','data/repo/ceph'))")
            if [ -d "$CLONE" ]; then ARGS+=(--clone "$CLONE" --refresh-target); fi
          fi
          set +e
          python3 -m pr_triage "${ARGS[@]}" > "/tmp/triage-pr-${PR}.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "per-pr failed (PR may not be in snapshot yet)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Write Job Summary
        if: steps.query.outputs.exit_code == '0'
        run: |
          python3 pr-triage/scripts/ci_write_pr_summary.py \
            "${{ inputs.pr_number }}" \
            "/tmp/triage-pr-${{ inputs.pr_number }}.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON
        if: inputs.upload_json_artifact && steps.query.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: pr-triage-pr-${{ inputs.pr_number }}
          path: /tmp/triage-pr-${{ inputs.pr_number }}.json
          retention-days: 7

      - name: Render PR comment
        id: comment_body
        if: inputs.post_comment
        env:
          PR: ${{ inputs.pr_number }}
          COMMENT_PR: ${{ inputs.comment_pr_number == 0 && inputs.pr_number || inputs.comment_pr_number }}
          PYTHONPATH: pr-triage
        run: |
          set -e
          REPO="${{ inputs.comment_repo }}"
          if [ -z "$REPO" ]; then REPO="${{ github.repository }}"; fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "comment_pr=$COMMENT_PR" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.query.outputs.exit_code }}" = "0" ]; then
            python3 pr-triage/scripts/render_pr_similar_comment.py \
              "$PR" "/tmp/triage-pr-${PR}.json" \
              --repo "${{ inputs.github_repo_links }}" > /tmp/pr-triage-comment.md
          elif [ "${{ inputs.post_on_query_failure }}" = "true" ]; then
            python3 pr-triage/scripts/render_not_in_snapshot_comment.py \
              --comment-pr "$COMMENT_PR" --query-pr "$PR" > /tmp/pr-triage-comment.md
          else
            echo "skip_comment=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Post or update PR comment
        if: inputs.post_comment && steps.comment_body.outputs.skip_comment != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: pr-triage
        run: |
          python3 pr-triage/scripts/post_pr_comment.py \
            --repo "${{ steps.comment_body.outputs.repo }}" \
            --pr "${{ steps.comment_body.outputs.comment_pr }}" \
            --body-file /tmp/pr-triage-comment.md
